<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{tagline}}" />
    <link rel="stylesheet" href="{{assets}}styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1>{{title}}</h1>
        <p class="sub">{{tagline}}</p>
        <div class="hero-actions">
          <a class="btn" href="#{{quickstartId}}">{{quickstart}}</a>
          <a class="btn ghost" href="https://github.com/">{{repo}}</a>
          <a class="btn ghost" href="{{switchHref}}" hreflang="{{switchLang}}" lang="{{switchLang}}">{{switchLabel}}</a>
        </div>
      </div>
    </header>

    <div class="wrap layout">
      <nav class="toc" aria-label="{{contents}}">
        <p class="toc-label">{{contents}}</p>
        <ul>
          {{toc}}
        </ul>
      </nav>
      <article class="doc">
        {{content}}
      </article>
    </div>

    <footer class="wrap footer">
      <p>{{footer}}</p>
    </footer>
  </body>
</html>
